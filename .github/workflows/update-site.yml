# Обновление сайта FIRST® Kazakhstan: данные из официальной Google-таблицы и Telegram + публикация на GitHub Pages.
# Запускается каждые 5 минут (быстрая проверка таблицы: изменилось место, дата, категория или ссылка — через несколько минут это
# на сайте), раз в час полностью (ещё и открывает каждую форму регистрации), при любом изменении файлов в репозитории, по сигналу
# из таблицы (repository_dispatch «sheet-updated», см. README → «Мгновенное обновление при правке таблицы») и вручную
# (Actions → «Обновление сайта» → Run workflow). Публикация идёт только когда данные изменились или запуск не по расписанию:
# иначе каждые 5 минут выкладывался бы тот же сайт. Если таблица или Telegram недоступны, сайт публикуется с прежними данными,
# а в запуске появляется предупреждение.
name: Обновление сайта

on:
  schedule:
    - cron: "3-58/5 * * * *"   # быстрая проверка (GitHub может запустить её на 5–15 минут позже расписания)
    - cron: "0 * * * *"        # полная проверка, с формами
  push:
    branches: [main, master]
  repository_dispatch:
    types: [sheet-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Загрузить расписание, проверить формы, прочитать вкладки «Сайт» и «Новости», взять новости из Telegram
        id: data
        continue-on-error: true
        env:
          FK_QUICK: ${{ github.event_name == 'schedule' && github.event.schedule != '0 * * * *' && '1' || '0' }}
        run: |
          pip install --quiet openpyxl==3.1.5
          python tools/update_data.py

      - name: Сохранить новые данные в репозитории
        id: save
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/data/sheet.js assets/data/news.js assets/data/site.js assets/data/status.js
          git add -A assets/img/news 2>/dev/null || true
          git add -A -- 'assets/img/season.*' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Изменений в данных нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Автообновление: расписание и новости"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Публиковать есть что: данные изменились, или запуск не по расписанию (правка файлов, сигнал из таблицы, ручной запуск)
      - name: Нужна ли публикация
        id: need
        env:
          CHANGED: ${{ steps.save.outputs.changed }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$CHANGED" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Данные не изменились — сайт уже актуален, публикация не нужна"
          fi

      - if: steps.need.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Сборка в папку _site: ?v=<хэш> у каждого файла (обновления сразу видны на любом устройстве, без старого кэша),
      # казахские тексты прямо в HTML (нет пустых «квадратов» до загрузки JavaScript), номер сборки для автообновления вкладок.
      # Подробности — в начале tools/build_site.mjs.
      - name: Собрать сайт
        if: steps.need.outputs.deploy == 'true'
        run: node tools/build_site.mjs _site

      - if: steps.need.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        if: steps.need.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Предупредить, если данные не обновились
        if: steps.data.outcome == 'failure' || steps.save.outcome == 'failure'
        env:
          DATA_OUTCOME: ${{ steps.data.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: |
          if [ "$DATA_OUTCOME" = "failure" ]; then
            echo "::warning title=Данные не обновились::Таблица или проверка данных завершились с ошибкой — смотрите шаг «Загрузить расписание…». Сайт опубликован с прежними данными."
          fi
          if [ "$SAVE_OUTCOME" = "failure" ]; then
            echo "::warning title=Данные не сохранены в репозитории::Не удалось записать новые данные (возможно, файлы assets/data/* правили вручную). Сайт опубликован, при следующем запуске попытка повторится."
          fi
