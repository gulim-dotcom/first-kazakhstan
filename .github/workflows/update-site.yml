# Временная версия только для этой ветки: снять зависший деплой GitHub Pages (коммит 604ced4),
# из-за которого публикация main отклоняется с ошибкой «in progress deployment». В main этот файл не меняется.
name: Обновление сайта

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stuck-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STUCK: 604ced407360a3ad05c637fe3b927bc95c6a4bae
    steps:
      - name: Статус зависшего деплоя
        run: gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${STUCK}" || true
      - name: Отменить зависший деплой
        run: gh api -i -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${STUCK}/cancel" || true
      - name: Статус после отмены
        run: gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${STUCK}" || true
