# Обновление сайта FIRST® Kazakhstan: данные из официальной Google-таблицы и Telegram + публикация на GitHub Pages.
# Запускается каждый час, при любом изменении файлов в репозитории, по сигналу из таблицы (repository_dispatch «sheet-updated»,
# см. README → «Мгновенное обновление при правке таблицы») и вручную (Actions → «Обновление сайта» → Run workflow).
# Если таблица или Telegram недоступны, сайт всё равно публикуется с прежними данными, а в запуске появляется предупреждение.
name: Обновление сайта

on:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main, master]
  repository_dispatch:
    types: [sheet-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Загрузить расписание, проверить формы, прочитать вкладки «Сайт» и «Новости», взять новости из Telegram
        id: data
        continue-on-error: true
        run: |
          pip install --quiet openpyxl==3.1.5
          python tools/update_data.py

      - name: Сохранить новые данные в репозитории
        id: save
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/data/sheet.js assets/data/news.js assets/data/site.js assets/data/status.js
          git add -A assets/img/news 2>/dev/null || true
          git add -A -- 'assets/img/season.*' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Изменений в данных нет"
          else
            git commit -m "Автообновление: расписание и новости"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Предупредить, если данные не обновились
        if: steps.data.outcome == 'failure' || steps.save.outcome == 'failure'
        env:
          DATA_OUTCOME: ${{ steps.data.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
        run: |
          if [ "$DATA_OUTCOME" = "failure" ]; then
            echo "::warning title=Данные не обновились::Таблица или проверка данных завершились с ошибкой — смотрите шаг «Загрузить расписание…». Сайт опубликован с прежними данными."
          fi
          if [ "$SAVE_OUTCOME" = "failure" ]; then
            echo "::warning title=Данные не сохранены в репозитории::Не удалось записать новые данные (возможно, файлы assets/data/* правили вручную). Сайт опубликован, при следующем запуске попытка повторится."
          fi
